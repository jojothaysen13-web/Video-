<title>Markt-Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500&display=swap">
<style>
/* Layout: Arcade-Startseite mit vier Spielkacheln; jedes Spiel = Canvas-Bühne mit Fragen-Banner oben, HUD und Touch-Steuerung darunter.
   Bewusst nur dunkel – passend zum Erklärvideo und zur Markt-Arena. */
:root {
  color-scheme: dark;
  --bg: #050507; --surface: #111117; --surface-2: #17171f; --line: rgba(255,255,255,.09); --line-2: rgba(255,255,255,.16);
  --fg: #F5F5F7; --mut: rgba(245,245,247,.62); --dim: rgba(245,245,247,.38);
  --markt: #8B6CFF; --n: #3D8BFF; --a: #FF8A3D; --gg: #2EE6A6; --formen: #FF4D8D; --staat: #FFD23D; --funk: #4DE1FF; --quiz: #C6FF3D;
  --ok: #2EE6A6; --bad: #FF5C6C;
  --font: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.glow i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(90px); opacity: .2; background: var(--acc, var(--quiz)); top: -38vmax; right: -25vmax; transition: background .6s; }
.glow i + i { background: var(--markt); opacity: .12; top: auto; right: auto; bottom: -42vmax; left: -30vmax; }
.wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--quiz); outline-offset: 3px; }
a { color: inherit; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; background: linear-gradient(var(--bg) 70%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; background: none; border: 0; padding: 0; }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--quiz); box-shadow: 0 0 14px var(--quiz); }
.xp { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; padding: 7px 12px; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(255,255,255,.04); }
.xp b { color: var(--quiz); font-weight: 500; }
.hero { padding: 26px 0 18px; display: grid; gap: 14px; }
.kicker { display: inline-flex; justify-self: start; align-self: start; align-items: center; gap: 9px; padding: 6px 13px 6px 11px; border-radius: 99px; border: 1px solid var(--line-2); background: rgba(255,255,255,.04); font-size: 12px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,.8); }
.kicker::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--acc, var(--quiz)); box-shadow: 0 0 10px var(--acc, var(--quiz)); }
h1 { font-size: clamp(38px, 8vw, 72px); line-height: .95; letter-spacing: -.055em; margin: 0; font-weight: 700; text-wrap: balance; }
h1 span { color: var(--quiz); }
.lead { color: var(--mut); font-size: 17px; max-width: 60ch; margin: 0; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-top: 14px; }
.tile { --c: var(--quiz); position: relative; text-align: left; display: grid; gap: 10px; align-content: start; padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; transition: transform .2s, border-color .2s; min-width: 0; }
.tile::after { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: var(--c); filter: blur(60px); opacity: .2; top: -70px; right: -60px; pointer-events: none; }
.tile:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 60%, transparent); }
.tile canvas { width: 100%; height: 120px; border-radius: 14px; background: #0a0a10; border: 1px solid var(--line); display: block; }
.tile h3 { margin: 4px 0 0; font-size: 21px; letter-spacing: -.03em; }
.tile p { margin: 0; color: var(--mut); font-size: 14.5px; }
.tile .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; color: var(--dim); }
.tile .meta b { color: var(--c); font-weight: 500; }
.crosslink { margin-top: 22px; padding: 16px 18px; border-radius: 16px; border: 1px dashed var(--line-2); color: var(--mut); font-size: 14.5px; }
.crosslink a { color: var(--fg); font-weight: 600; }
.view-head { display: grid; gap: 8px; padding: 14px 0 14px; }
.back { justify-self: start; display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; color: var(--mut); padding: 4px 0; font-size: 14px; }
.back:hover { color: var(--fg); }
h2 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.05em; line-height: 1; }
.sub { color: var(--mut); margin: 0; max-width: 66ch; font-size: 15px; }

/* Bühne */
.stage { position: relative; width: 100%; border-radius: 20px; overflow: hidden; border: 1px solid var(--line-2); background: #07070b; box-shadow: 0 30px 80px -40px var(--acc); }
.stage canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.hudc { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; flex-wrap: wrap; }
.hudc span { font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border-radius: 99px; background: rgba(5,5,7,.72); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.hudc .hearts { color: var(--bad); letter-spacing: 2px; }
.banner { position: absolute; left: 10px; right: 10px; top: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(8,8,12,.86); border: 1px solid var(--line-2); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: grid; gap: 8px; pointer-events: none; }
.banner .bq { font-weight: 650; font-size: clamp(15px, 2.6vw, 19px); letter-spacing: -.02em; line-height: 1.2; text-align: center; text-wrap: balance; }
.banner .bo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.banner .bo span { font-size: clamp(11.5px, 2vw, 13.5px); font-weight: 600; text-align: center; padding: 6px 6px; border-radius: 9px; background: rgba(255,255,255,.07); line-height: 1.15; min-width: 0; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.banner .bo span small { display: block; font-family: var(--mono); font-weight: 500; font-size: 10px; color: var(--dim); margin-bottom: 2px; }
.banner.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, rgba(8,8,12,.9)); }
.banner.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, rgba(8,8,12,.9)); }
.banner .tag { font-family: var(--mono); font-size: 11px; color: var(--acc); text-transform: uppercase; letter-spacing: .08em; text-align: center; }
.banner .prog { height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.banner .prog i { display: block; height: 100%; background: var(--acc); }
.ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; background: rgba(5,5,7,.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.ov[hidden] { display: none !important; }
.ovc { width: min(100%, 480px); max-height: 100%; overflow: auto; display: grid; gap: 12px; justify-items: center; text-align: center; padding: 22px 18px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line-2); }
.ovc h3 { margin: 0; font-size: clamp(26px, 5vw, 36px); letter-spacing: -.045em; line-height: 1; }
.ovc p { margin: 0; color: var(--mut); font-size: 14.5px; }
.ovc .big { font-size: clamp(48px, 10vw, 76px); font-weight: 700; letter-spacing: -.06em; line-height: 1; color: var(--acc); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.keys span { font-family: var(--mono); font-size: 12px; padding: 5px 9px; border-radius: 8px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--mut); }
.missed { width: 100%; display: grid; gap: 6px; text-align: left; }
.missed div { font-size: 13.5px; padding: 9px 11px; border-radius: 11px; background: color-mix(in srgb, var(--bad) 10%, var(--surface-2)); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.missed b { color: var(--ok); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; padding: 13px 20px; font-weight: 600; border: 1px solid var(--line-2); background: rgba(255,255,255,.06); }
.btn.primary { background: var(--acc, var(--quiz)); color: #050507; border-color: transparent; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pad { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; margin-top: 12px; }
.padbtn { padding: 16px 8px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 18px; font-weight: 700; touch-action: none; user-select: none; -webkit-user-select: none; }
.padbtn:active { background: color-mix(in srgb, var(--acc) 20%, var(--surface-2)); border-color: var(--acc); }
.btn.sound { justify-self: start; padding: 9px 14px; font-size: 14px; border-radius: 12px; }
.tip { color: var(--dim); font-size: 13px; margin-top: 10px; }
canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (hover: hover) and (pointer: fine) { .pad.touch-only { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="glow"><i></i><i></i></div>

<script>
/* ═════════════ Inhalte ═════════════ */

  { q: 'Bessere Abläufe senken die Kosten um 10 %. Welche Bestimmungsgröße?', o: ['Kosten der Produktion', 'Wettbewerb', 'Unternehmensziel'], a: 0 },
  { q: 'Kampfpreise für 12 % Marktanteil. Welche Bestimmungsgröße?', o: ['Marktpreis', 'Unternehmensziel', 'Externe Faktoren'], a: 1 },
  { q: 'Welcher ist ein Faktormarkt?', o: ['Konsumgütermarkt', 'Headset-Markt', 'Kapitalmarkt'], a: 2 },

  { q: 'Netter Shop-Mitarbeiter: Was fehlt zum vollkommenen Markt?', o: ['Transparenz', 'Keine Präferenzen', 'Marktzugang'], a: 1 },
  { q: 'Staatliche Zulassung nötig: Was fehlt?', o: ['Freier Marktzugang', 'Homogene Güter', 'Polypol'], a: 0 },

  { q: '6 €: N 400 / A 400. Was liegt bei 6 € vor?', o: ['Überhang', 'Gleichgewicht', 'Starrer Markt'], a: 1 },

// Kategorien für den Begriffs-Regen
const CATS = [
  { name: 'Faktormärkte', good: ['Arbeitsmarkt', 'Kapitalmarkt', 'Immobilienmarkt'], bad: ['Konsumgütermarkt', 'Produktionsgütermarkt', 'Headset-Markt', 'Wochenmarkt'] },
  { name: 'Bestimmungsgrößen der Nachfrage', good: ['Einkommen', 'Vorlieben', 'Komplementärgüter', 'Substitutionsgüter', 'Externe Faktoren', 'Preis des Gutes'], bad: ['Produktionskosten', 'Wettbewerbssituation', 'Unternehmensziel'] },
  { name: 'Bestimmungsgrößen des Angebots', good: ['Produktionskosten', 'Wettbewerbssituation', 'Unternehmensziel', 'Erzielbarer Marktpreis', 'Externe Faktoren'], bad: ['Einkommen', 'Vorlieben', 'Komplementärgüter', 'Substitutionsgüter'] },
  { name: 'Voraussetzungen des vollkommenen Markts', good: ['Polypol', 'Freier Marktzugang', 'Homogene Güter', 'Keine Präferenzen', 'Markttransparenz', 'Sofortige Reaktion'], bad: ['Monopol', 'Lizenzpflicht', 'Markentreue', 'Verschiedene Güter', 'Lange Verträge'] },
  { name: 'Funktionen des Marktpreises', good: ['Ausgleichsfunktion', 'Signalfunktion', 'Lenkungsfunktion', 'Auslesefunktion'], bad: ['Werbefunktion', 'Lagerfunktion', 'Steuerfunktion', 'Vermittlung'] },
  { name: 'Folgen eines Höchstpreises', good: ['Nachfrageüberhang', 'Schwarzmarkt', 'Warteschlangen', 'Knappheit'], bad: ['Angebotsüberhang', 'Überschüsse', 'Staat kauft auf', 'Markträumung'] },
  { name: 'Folgen eines Mindestpreises', good: ['Angebotsüberhang', 'Überschüsse', 'Staat kauft auf', 'Lagerkosten'], bad: ['Nachfrageüberhang', 'Schwarzmarkt', 'Warteschlangen'] },
  { name: 'Beispiele Verkäufermarkt', good: ['Benzin', 'Luxussportwagen', 'Mais-Defizit'], bad: ['PC', 'Pkw', 'Buchpreisbindung', 'Windpark-Zulieferer'] },
];

// Marktereignisse für die Gleichgewichts-Jagd
const EVENTS = [
  { t: 'Kartoffeln: schlechte Ernte nach Hitzesommer', k: 'A', d: -1 },
  { t: 'Flüge: Kerosinkosten steigen stark', k: 'A', d: -1 },
  { t: 'Weihnachtsbäume: viele Erzeuger geben auf', k: 'A', d: -1 },
  { t: 'Headsets: Hersteller verbessert die Fertigung', k: 'A', d: 1 },
  { t: 'Kartoffeln: Rekordernte', k: 'A', d: 1 },
  { t: 'Laptops: neue Anbieter drängen auf den Markt', k: 'A', d: 1 },
  { t: 'E-Bikes: Tarifeinkommen steigen', k: 'N', d: 1 },
  { t: 'Sneaker: Modell wird zum TikTok-Trend', k: 'N', d: 1 },
  { t: 'E-Bikes: Wechselakkus werden billiger', k: 'N', d: 1 },
  { t: 'Deutschlandticket: Tankrabatt macht Autofahren billiger', k: 'N', d: -1 },
  { t: 'Eis: kühler, verregneter Sommer', k: 'N', d: -1 },
  { t: 'Laptops: Geräte werden länger genutzt', k: 'N', d: -1 },
];

/* ═════════════ Infrastruktur ═════════════ */
const COL = { lime: '#C6FF3D', violet: '#8B6CFF', blue: '#3D8BFF', orange: '#FF8A3D', mint: '#2EE6A6', pink: '#FF4D8D', yellow: '#FFD23D', cyan: '#4DE1FF', bad: '#FF5C6C', fg: '#F5F5F7' };
const PAL = [COL.violet, COL.blue, COL.orange, COL.mint, COL.pink, COL.yellow, COL.cyan, COL.lime];
const FONT = "'Geist', ui-sans-serif, system-ui, sans-serif";
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const store = {
  get(k, d) { try { const v = localStorage.getItem('arcade:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('arcade:' + k, JSON.stringify(v)); } catch {} },
};
const ST = { xp: store.get('xp', 0), best: store.get('best', {}) };
$('#xp').textContent = ST.xp;
function addXP(n) { ST.xp += n; store.set('xp', ST.xp); $('#xp').textContent = ST.xp; }
function saveBest(id, v) { if (v > (ST.best[id] ?? -1)) { ST.best[id] = v; store.set('best', ST.best); return true; } return false; }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let disposers = [];
function onDispose(f) { disposers.push(f); }
function listen(t, type, fn, opt) { t.addEventListener(type, fn, opt); onDispose(() => t.removeEventListener(type, fn, opt)); }
function loop(fn) {
  let last = performance.now(), id = 0, alive = true;
  const f = (t) => { if (!alive) return; id = requestAnimationFrame(f); const dt = Math.min(0.05, (t - last) / 1000); last = t; if (!document.hidden) fn(dt, t); };
  id = requestAnimationFrame(f);
  onDispose(() => { alive = false; cancelAnimationFrame(id); });
}
function rr(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function wrapText(c, text, maxW) { const words = text.split(' '); const lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }

/* Konfetti */
const cv0 = $('#confetti'), cx0 = cv0.getContext('2d'); let confParts = [], confRaf = 0;
function confetti(n = 110) {
  if (reduceMotion) return;
  cv0.width = innerWidth * devicePixelRatio; cv0.height = innerHeight * devicePixelRatio;
  for (let i = 0; i < n; i++) confParts.push({ x: innerWidth / 2, y: innerHeight * .35, vx: rnd(-7, 7), vy: rnd(-16, -4), s: rnd(4, 11), r: rnd(0, 6), vr: rnd(-.15, .15), c: PAL[i % PAL.length], life: 0 });
  if (!confRaf) confTick();
}
function confTick() {
  cx0.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); cx0.clearRect(0, 0, innerWidth, innerHeight);
